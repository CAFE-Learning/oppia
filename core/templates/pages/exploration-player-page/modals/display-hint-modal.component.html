<div>
  <button type="button" class="bt" (click)="closeModal()">&times;</button>
</div>
<div class="oppia-learner-hint-and-solution-modal-title">
  <span [innerHTML]="'Hint ' + (index+1)"></span>
</div>
<div class="modal-body">
  <div>
    <button class="left-arrow" (click)="getPrevHint()" *ngIf="showPrevHint"> < </button>
    <button class="right-arrow" (click)="getNextHint()" *ngIf="showNextHint"> > </button>
  </div>
  <div class="sp">
    <oppia-rte-output-display class="oppia-learner-hint-and-solution-modal-body"
                              [rteString]="hint.html">
    </oppia-rte-output-display>
  </div>
</div>
<div class="dots" *ngIf="maxIndex>0">
  <span *ngFor="let dot of dots; let i = index"
        class="dot"
        [class.active]="i === index">
  </span>
</div>
<button class="oppia-learner-got-it-button e2e-test-learner-got-it-button md-button md-default-theme"
        (click)="closeModal()">
  <span [innerHTML]="'I18N_GOT_IT' | translate"></span>
</button>
<span class="clearfix"></span>
<style>
  .left-arrow {
    background: none;
    border: none;
    float: left;
    font-size: 2.5rem;
  }
  .right-arrow {
    background: none;
    border: none;
    float: right;
    font-size: 2.5rem;
  }
  .bt {
    background: none;
    border: none;
    color: #000;
    cursor: pointer;
    font-size: 1.5rem;
    line-height: 1;
    padding: 0;
    position: absolute;
    right: 0.5rem;
    top: 0.5rem;
  }
  .oppia-learner-hint-and-solution-modal-title {
    color: #00786d;
    font-family: 'Capriola', Roboto, arial, sans-serif;
    font-size: 1.75em;
    font-weight: bold;
    padding-top: 20px;
    text-align: center;
  }
  .oppia-learner-got-it-button {
    background-color: #00786d;
    display: block;
    margin-left: auto;
    margin-right: auto;
    width: 280px;
  }
  @media screen and (max-width: 768px) {
    .oppia-learner-got-it-button {
      width: 296px;
    }
  }
  .oppia-learner-hint-and-solution-modal-body {
    text-align: center;
    transition: transform 0.4s ease-in-out;
  }
  .sp {
    margin-left: 50px;
    margin-right: 30px;
  }
  .modal-body {
    max-height: calc(85vh - 125px);
    overflow-y: auto;
  }
  .dots {
    display: flex;
    gap: 10px;
    justify-content: center;

  }
  .dot {
    background-color: gray;
    border-radius: 50%;
    cursor: pointer;
    display: inline-block;
    height: 12px;
    margin-bottom: 20px;
    margin-top: 20px;
    transition: background-color 0.3s;
    width: 12px;
  }
  .dot.active {
    background-color: dodgerblue;
  }
</style>
